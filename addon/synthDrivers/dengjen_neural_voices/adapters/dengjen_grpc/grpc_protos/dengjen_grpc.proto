syntax = "proto3";

package dengjen_grpc;

service DengjenGrpc {

  rpc GetDengjenVersion(Empty) returns (Version) {}

  
  rpc LoadVoice(VoiceConfigLocation) returns (VoiceDescriptor) {}

  
  rpc GetVoiceInfo(VoiceRef) returns (VoiceDescriptor) {}

  
  rpc GetSynthesisOptions(VoiceRef) returns (SynthesisSettings) {}

  
  rpc SetSynthesisOptions(VoiceSynthesisSettings) returns (SynthesisSettings) {}

  
  rpc SynthesizeUtterance(SynthesisRequest) returns (stream SynthesisChunk) {}

  
  rpc SynthesizeUtteranceRealtime(SynthesisRequest) returns (stream RealtimeAudioChunk) {}

  rpc Recognize(RecognizeRequest) returns (RecognizeResponse) {}

  // The voice manager RPCs fail with FAILED_PRECONDITION until the server is
  // configured with a catalogue (see the DENGJEN_GRPC_VOICES_* variables).
  // Downloads the catalogue and caches it for offline use.
  rpc FetchCatalogue(Empty) returns (CatalogueInfo) {}

  // Lists catalogue voices; fails with FAILED_PRECONDITION before the first
  // successful FetchCatalogue.
  rpc ListVoices(ListVoicesRequest) returns (VoiceList) {}

  rpc ListInstalledVoices(Empty) returns (InstalledVoiceList) {}

  // Downloads, verifies and installs a voice. Cancelled when the caller drops
  // the stream; a partial download is kept and resumed by the next call.
  rpc InstallVoice(InstallVoiceRequest) returns (stream InstallProgress) {}

  rpc RemoveVoice(RemoveVoiceRequest) returns (Empty) {}
}

enum SynthesisMode {
  // Not set by the caller; the server falls back to MODE_LAZY.
  MODE_UNSPECIFIED = 0;
  // Synthesizes one sentence per call to the stream, sequentially. Lowest
  // latency to the first chunk, no parallelism.
  MODE_LAZY = 1;
  // Synthesizes every sentence concurrently, then yields them in order once
  // all of them are done. Higher throughput for long, multi-sentence text,
  // but nothing is emitted until the whole request finishes.
  MODE_PARALLEL = 2;
  // Synthesizes sentences in bounded-size concurrent groups (batch_size),
  // yielding each group's results before starting the next. A middle
  // ground between MODE_LAZY and MODE_PARALLEL: partial output streams out
  // sooner than MODE_PARALLEL, with less per-request thread/memory
  // pressure than firing every sentence at once.
  MODE_BATCHED = 3;
}
enum VoiceQuality {
  VOICE_QUALITY_UNSPECIFIED = 0;
  VOICE_QUALITY_X_LOW = 1;
  VOICE_QUALITY_LOW = 2;
  VOICE_QUALITY_MEDIUM = 3;
  VOICE_QUALITY_HIGH = 4;
}

message Empty {}

message Version {
    string version = 1;
}

message VoiceRef {
    string voice_key = 1;
}

message VoiceDescriptor {
  string voice_key = 1;
  SynthesisSettings synthesis_options = 2;
  map<int64, string> speakers = 3;
  AudioFormat audio = 4;
  optional string language = 5;
  optional VoiceQuality quality = 6;
  optional bool supports_streaming_output = 7;
}

message VoiceConfigLocation {
  string path = 1;
}


message SynthesisRequest {
  string voice_key = 1;
  string text = 2;
  ProsodyControls prosody = 3;
  SynthesisMode synthesis_mode = 4;
  // Only meaningful when synthesis_mode is MODE_BATCHED. Unset uses the
  // server's default; an explicit 0 is rejected as invalid_argument.
  optional uint32 batch_size = 5;
}

message SynthesisSettings {
  optional string speaker = 1;
  optional float length_scale = 2;
  optional float noise_scale = 3;
  optional float noise_w = 4;
  
  
  
  map<string, float> parameters = 5;
}

message VoiceSynthesisSettings{
    string voice_key = 1;
    SynthesisSettings synthesis_options = 2;
}


message AudioFormat {
  uint32 sample_rate = 1;
  uint32 num_channels = 2;
  uint32 sample_width = 3;
}


message SynthesisChunk {
  bytes audio_bytes = 1;
  float real_time_factor = 2;
}

message RealtimeAudioChunk {
  bytes audio_bytes = 1;
}

message ProsodyControls {
    optional uint32 rate =1;
    optional uint32 volume =2;
    optional uint32 pitch =3;
    optional uint32 appended_silence_ms =4;
}

message RecognizeRequest {
  // Mono 16-bit little-endian PCM.
  bytes pcm_s16le = 1;
  uint32 sample_rate = 2;
}

message RecognizeResponse {
  string text = 1;
}

message CatalogueInfo {
  uint32 voice_count = 1;
}

message ListVoicesRequest {
  // Language code or family such as "ku" or "ku_TR"; unset lists every voice.
  optional string language = 1;
}

message CatalogueVoice {
  string key = 1;
  string name = 2;
  string language_code = 3;
  string language_family = 4;
  string quality = 5;
  uint32 num_speakers = 6;
  uint64 total_bytes = 7;
}

message VoiceList {
  repeated CatalogueVoice voices = 1;
}

message InstalledVoiceInfo {
  string key = 1;
  string model_type = 2;
  string name = 3;
  string language = 4;
  string description = 5;
}

message InstalledVoiceList {
  repeated InstalledVoiceInfo voices = 1;
}

message InstallVoiceRequest {
  string key = 1;
}

message InstallProgress {
  uint64 done_bytes = 1;
  uint64 total_bytes = 2;
}

message RemoveVoiceRequest {
  string key = 1;
}
