sonar.projectKey=austek_sonata-nvda
sonar.organization=austek

sonar.sources=addon/globalPlugins,addon/synthDrivers/sonata_neural_voices,addon/installTasks.py,buildVars.py,.github/workflows
sonar.tests=tests

# Vendored third-party (cffi, pycparser, psutil, miniaudio, mureq, and wxPython's
# sized_controls), generated gRPC stubs, and the shipped engine binaries.
sonar.exclusions=addon/synthDrivers/sonata_neural_voices/lib/**,addon/synthDrivers/sonata_neural_voices/grpc_client/grpc_protos/**,addon/synthDrivers/sonata_neural_voices/bin/**,addon/globalPlugins/sonata_tts_global_plugin/sized_controls.py

# Not exercised by CI, so Sonar's Zero Coverage Sensor would otherwise report
# these at 0% and drag every new-code coverage measurement down. They stay in
# sonar.sources: they are still analysed for issues, they are only removed from
# the coverage metric.
#   globalPlugins/**  needs winsound (Windows-only stdlib) and real wx.lib
#   grpc_client/**    needs the bundled grpc extension and sonata-grpc.exe
# synthDrivers/sonata_neural_voices/__init__.py (the SynthDriver itself) is
# covered by tests/test_synth_driver.py as of #65 and no longer needs excluding.
sonar.coverage.exclusions=addon/globalPlugins/**,addon/synthDrivers/sonata_neural_voices/grpc_client/**

# S8544 wants pip installs to resolve against a lock file. Our direct CI tooling
# is already ==-pinned in requirements-bootstrap/-build/-test.txt; going further
# means --require-hashes plus generated lock files covering every transitive dep
# on both Linux and Windows, which is not worth the maintenance here. It is a
# MAJOR VULNERABILITY, so leaving it open would hold new_security_rating at C and
# fail the required gate on any PR touching these files. Scoped to the workflows
# so S8541, S7637 and S6573 stay enforced there.
#
# S7631 flags the `actions/checkout` of the PR head in sonar-fork-scan.yml as
# executing untrusted fork code -- the generic pattern it's checking for, but
# not what actually happens here: that job only checks out the PR's source
# for the Sonar scanner to read statically and never installs dependencies
# or runs anything from the fork (that already happened, safely, with no
# secrets, in sonar-fork-coverage.yml). zizmor's equivalent dangerous-triggers
# audit is suppressed inline in that file for the same reason. Scoped to that
# one file so S7631 stays enforced everywhere else.
sonar.issue.ignore.multicriteria=pipLock,forkCheckout
sonar.issue.ignore.multicriteria.pipLock.ruleKey=githubactions:S8544
sonar.issue.ignore.multicriteria.pipLock.resourceKey=.github/workflows/**/*
sonar.issue.ignore.multicriteria.forkCheckout.ruleKey=githubactions:S7631
sonar.issue.ignore.multicriteria.forkCheckout.resourceKey=.github/workflows/sonar-fork-scan.yml

sonar.python.version=3.13
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8
