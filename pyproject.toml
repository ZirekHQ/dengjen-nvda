[tool.nvda-testkit]
addon-bundle = "dengjen_neural_voices-*.nvda-addon"
nvda-channel = "stable"
allow-eval = true
ignore-log-errors = [
    'nvwave|WASAPI|audio (?:device|output|session|endpoint)',
    'synthDriver|synthesi[sz]|espeak|oneCore|SAPI',
    'braille ?display|brailleDisplayDriver|brailleInput',
    'UIAHandler|IAccessible|interactive desktop|desktop object',
]

[tool.ruff]
extend-exclude = [
    "addon/synthDrivers/dengjen_neural_voices/lib",
    "addon/synthDrivers/dengjen_neural_voices/adapters/dengjen_grpc/grpc_protos/dengjen_grpc_pb2.py",
    "addon/synthDrivers/dengjen_neural_voices/adapters/dengjen_grpc/grpc_protos/dengjen_grpc_pb2.pyi",
    "addon/synthDrivers/dengjen_neural_voices/adapters/dengjen_grpc/grpc_protos/dengjen_grpc_pb2_grpc.py",
    
    
    "addon/globalPlugins/dengjen_tts_global_plugin/sized_controls.py",
]

builtins = ["_"]

[tool.ruff.lint]
extend-ignore = [
    
    
    
    
    "BLE001",
]

[tool.ruff.lint.per-file-ignores]


"site_scons/site_tools/NVDATool/__init__.py" = ["N999"]


"tests/**/*.py" = ["TRY002", "S102", "RUF012"]
"tests_*/**/*.py" = ["TRY002", "S102", "RUF012"]

[project]
name = "dengjen-nvda"
version = "0.0.0"
requires-python = ">=3.13,<3.14"

[dependency-groups]
vendor = [
    "cffi==2.1.1",
    "certifi",
    "grpcio>=1.84",
    "miniaudio==1.71",
    "mureq==0.3.0",
    "protobuf>=7.35.1,<8",
    "psutil==7.2.2",
    "pycparser==3.0",
]
codegen = ["grpcio-tools==1.84.*"]

[tool.uv]
package = false
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]
