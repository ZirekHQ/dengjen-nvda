name: Release

# build-and-release calls build_addon.yml via workflow_call, not push:tags -- a bot-authored
# tag push doesn't fire that listener (GitHub's recursion guard). prepare-release.yml is the
# single entry point; this file has no trigger/gate of its own.
on:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      new_tag:
        required: false
        type: string
      dry_run:
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  resolve:
    runs-on: ubuntu-latest
    # github.event_name isn't literally 'workflow_call' through nested hops -- it inherits the
    # top-level caller's event, so inputs.new_tag != '' detects the override path directly. A
    # push landing >1 new commit (not this repo's squash/rebase PR flow) would miss earlier ones.
    if: "inputs.new_tag != '' || startsWith(github.event.head_commit.message, 'chore: bump workspace version -> ')"
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve addon version
        id: version
        env:
          NEW_TAG: ${{ inputs.new_tag }}
        run: |
          set -euo pipefail
          if [ -n "${NEW_TAG:-}" ]; then
            version="${NEW_TAG#v}"
            if ! echo "$version" | grep -qE '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
              echo "::error::new_tag '${NEW_TAG}' doesn't look like a vX.Y.Z tag" >&2
              exit 1
            fi
          else
            version="$(grep -oE 'addon_version="[0-9]+\.[0-9]+\.[0-9]+"' buildVars.py | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
            if [ -z "$version" ]; then
              echo "::error::Couldn't find addon_version=\"X.Y.Z\" in buildVars.py" >&2
              exit 1
            fi
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  tag:
    name: Push release tag
    needs: resolve
    if: inputs.dry_run != true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Push release tag
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        # Checked against origin, not the local clone -- checkout's shallow fetch wouldn't reliably reflect a tag pushed by an earlier attempt.
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          existing="$(git ls-remote origin "refs/tags/v${VERSION}" | cut -f1)"
          if [ -n "$existing" ]; then
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::v${VERSION} already exists on origin and points at ${existing}, not this commit (${GITHUB_SHA})" >&2
              exit 1
            fi
            echo "v${VERSION} already exists on origin and points at this commit -- reusing it"
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          else
            echo "::error::Refusing to create v${VERSION} from ${GITHUB_REF} -- release tags are only created from main" >&2
            exit 1
          fi

  build-and-release:
    name: Build and publish release
    needs: [resolve, tag]
    permissions:
      contents: write
    uses: ./.github/workflows/build_addon.yml # zizmor: ignore[self-repository] CI is pinned to zizmor v1.28.0, which predates $/ syntax support
    with:
      ref: refs/tags/v${{ needs.resolve.outputs.version }}
