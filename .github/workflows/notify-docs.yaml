name: Notify docs site

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Ref or tag to notify about (defaults to the current ref)
        required: false
        type: string

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve ref
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_REF: ${{ inputs.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            ref="$RELEASE_TAG"
          else
            ref="${INPUT_REF:-$REF_NAME}"
          fi
          if [[ "$ref" == *$'\n'* ]]; then
            echo "::error::resolved ref contains newline characters" >&2
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Create docs app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.DOCS_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_APP_PRIVATE_KEY }}
          repositories: ZirekHQ.github.io
          permission-contents: write

      - name: Dispatch update to docs site
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: ZirekHQ/ZirekHQ.github.io
          event-type: update-docs
          client-payload: |-
            {
              "repository": ${{ toJSON(github.repository) }},
              "ref": ${{ toJSON(steps.resolve.outputs.ref) }},
              "actor": ${{ toJSON(github.actor) }}
            }
