name: Sonar fork coverage

# The Sonar job in sonar.yml is deliberately skipped for fork PRs because
# forks are never given SONAR_TOKEN. This workflow builds what a real scan
# needs -- a full checkout (including git history, for Sonar's blame/new-code
# detection) plus a coverage report -- using only the read-only, secret-less
# token that `pull_request` gets for fork PRs, and packages it as a plain tar
# archive artifact.
#
# sonar-fork-scan.yml (workflow_dispatch, manually triggered by a maintainer
# after reviewing the diff) extracts that archive with plain `tar`, never a
# git operation, so it never runs git fetch/checkout against fork content and
# never executes anything from the fork -- the archive is only read
# statically by the Sonar scanner. This workflow must never gain
# `secrets:` access and must never do anything beyond running the PR's own
# test suite, exactly as any other fork `pull_request` job already safely
# does.

on:
  pull_request:
    branches: [ main ]

permissions: {}

concurrency:
  group: sonar-fork-coverage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Mirrors sonar.yml's job of the same name: tests_contract/ and tests_gui/ are
  # Windows-only, so without this the modules only they reach would land in the
  # fork's report at 0% (#89). Runs the fork's own tests with no secrets, exactly
  # as build_addon.yml's windows-latest leg already does for every fork PR.
  windows_coverage:
    name: Windows coverage for fork scan
    runs-on: windows-latest
    permissions:
      contents: read
    if: github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade --only-binary :all: -r requirements-bootstrap.txt
          pip install --only-binary :all: -r requirements-test.txt
          pip install --only-binary :all: -r requirements-test-gui.txt

      # Each tree needs its own COVERAGE_FILE: a bare `pytest --cov` erases
      # whatever data files it finds first.
      - name: Run tests with coverage
        env:
          COVERAGE_FILE: .coverage.windows.tests
        run: pytest --cov

      - name: Run gRPC contract tests with coverage
        env:
          COVERAGE_FILE: .coverage.windows.contract
        run: pytest tests_contract/ --cov -v

      - name: Run GUI smoke tests with coverage
        env:
          COVERAGE_FILE: .coverage.windows.gui
        run: pytest tests_gui/ --cov -v

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: sonar-fork-windows-coverage
          path: .coverage.windows.*
          include-hidden-files: true # coverage data files start with a dot
          retention-days: 7

  coverage:
    name: Build coverage for fork scan
    runs-on: ubuntu-latest
    needs: ["windows_coverage"]
    permissions:
      contents: read
    # Same-repo PRs are scanned directly by sonar.yml; only forks need this.
    if: github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Pinned to the actual PR head, not actions/checkout's default
          # ephemeral merge commit -- otherwise the scanner analyzes a
          # commit SHA that doesn't match the PR, and SonarCloud can't
          # attach its status to the commit branch protection actually
          # checks.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0 # Sonar needs full history for new-code detection and blame
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade --only-binary :all: -r requirements-bootstrap.txt
          pip install --only-binary :all: -r requirements-test.txt

      - name: Run tests with coverage
        run: pytest --cov

      # After the run above, never before: `pytest --cov` deletes any
      # .coverage.* data files already sitting in the workspace.
      - name: Download the Windows legs' coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sonar-fork-windows-coverage

      # relative_files in .coveragerc is what makes this work across OSes:
      # combine remaps the Windows data's `addon\...` paths onto `addon/...`.
      - name: Merge into one coverage report
        run: |
          python -m coverage combine --append
          python -m coverage xml

      - name: Archive workspace for the manual scan workflow
        run: tar -czf "$RUNNER_TEMP/workspace.tar.gz" -C "$GITHUB_WORKSPACE" .

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: sonar-fork-workspace
          path: ${{ runner.temp }}/workspace.tar.gz
          retention-days: 7
