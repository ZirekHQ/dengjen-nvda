name: Prepare release

# Proposes a release; merging the opened PR is what actually cuts one -- release.yml tags that
# merge commit and publishes the GitHub Release automatically.
on:
  workflow_dispatch:
    inputs:
      new_tag:
        description: "Skip the PR: release this exact vX.Y.Z tag directly (requires approval)"
        required: false
        type: string
      dry_run:
        description: "Dry Run: resolve the version but don't push a tag (only used together with new_tag)"
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  # Normal path: compute the next version and open the PR. Merging it is the release gate --
  # nothing here needs approval of its own. Skipped when new_tag selects the override path below.
  prepare:
    if: inputs.new_tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version

      - name: Compute next version
        id: next
        run: |
          set -uo pipefail
          # `run:` steps execute as `bash -e {0}` regardless of `set` above -- a bare assignment
          # would abort here on next-version.sh's exit 1, before rc is ever inspected.
          if version="$(bash scripts/next-version.sh)"; then
            rc=0
          else
            rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            echo "version=${version}" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -eq 1 ]; then
            echo "::notice::Nothing release-worthy since the last tag -- skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::scripts/next-version.sh failed (exit ${rc})"
            exit "$rc"
          fi

      - name: Bump version
        if: steps.next.outputs.skip != 'true'
        run: bash scripts/bump-version.sh "${STEPS_NEXT_OUTPUTS_VERSION}"
        env:
          STEPS_NEXT_OUTPUTS_VERSION: ${{ steps.next.outputs.version }}

      - name: Open release PR
        if: steps.next.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          branch="chore/bump-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add buildVars.py
          git commit -m "chore: bump workspace version -> ${VERSION}"
          git push -u origin "$branch"
          gh pr create --title "chore: bump workspace version -> ${VERSION}" \
            --body "Computed by \`prepare-release.yml\` from Conventional Commit subjects since the last tag (see \`scripts/next-version.sh\`). **Merging this releases v${VERSION}**: \`release.yml\` tags this merge commit \`v${VERSION}\`, which fires \`build_addon.yml\`'s tag trigger and publishes the GitHub Release with notes generated by \`gh release create --generate-notes\` from merged PRs since the previous tag, no further approval needed. Review the version and the diff carefully before merging -- this is the real decision point." \
            --base main --head "$branch"

  # Override path: the only step in this pipeline with no PR review to fall back on, so it's
  # the only one needing a human gate -- release.yml's own workflow_dispatch previously had
  # none, an unapproved bypass this closes.
  gate:
    if: inputs.new_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    steps:
      - run: echo "approved"

  release-now:
    needs: gate
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml # zizmor: ignore[self-repository] CI is pinned to zizmor v1.28.0, which predates $/ syntax support
    with:
      new_tag: ${{ inputs.new_tag }}
      dry_run: ${{ inputs.dry_run == true }}
