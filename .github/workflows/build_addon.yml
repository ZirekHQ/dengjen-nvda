name: build addon

on:
  push:
    tags: ["v*"]

  pull_request:
    branches: [ main, master ]

  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: "3.13"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade --only-binary :all: -r requirements-bootstrap.txt
        pip install --only-binary :all: -r requirements-build.txt
        sudo apt-get update  -y
        sudo apt-get install -y gettext

    - name: Code checks
      run: export SKIP=no-commit-to-branch; pre-commit run --all

    - name: building addon
      run: scons && scons pot

    - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
      with:
        name: packaged_addon
        path: |
          ./*.nvda-addon
          ./*.pot

  test_matrix:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade --only-binary :all: -r requirements-bootstrap.txt
          pip install --only-binary :all: -r requirements-test.txt

      - name: Run tests
        run: pytest

      # Separate from `pytest` above (testpaths=tests excludes this already):
      # tests_contract/'s conftest.py imports the real grpc package, incompatible
      # with tests/conftest.py's MagicMock stub of it. Windows-only since the exe is.
      - name: Run gRPC contract tests
        if: runner.os == 'Windows'
        run: pytest tests_contract/ -v

      # Same reason as the contract tests: tests_gui/ needs the real wxPython,
      # which tests/conftest.py replaces with a stub (a stub can't be a base
      # class for the wx subclasses in components.py); wxPython ships no Linux wheels.
      - name: Run GUI smoke tests
        if: runner.os == 'Windows'
        run: |
          pip install --only-binary :all: -r requirements-test-gui.txt
          pytest tests_gui/ -v

  # Stable check name for branch protection: matrix jobs report as
  # "test_matrix (<os>)", so the bare name would never be published.
  test:
    runs-on: ubuntu-latest
    permissions: {}
    needs: ["test_matrix"]
    if: always()
    steps:
      - name: Check matrix result
        run: |
          if [ "${{ needs.test_matrix.result }}" != "success" ]; then
            echo "test_matrix concluded: ${{ needs.test_matrix.result }}"
            exit 1
          fi

  e2e:
    runs-on: windows-2025
    permissions:
      contents: read
    needs: ["build"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: download built addon
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packaged_addon

      - name: Install e2e test dependencies
        run: "pip install --only-binary :all: -r requirements-test-e2e.txt"

      - name: Restore NVDA launcher cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/nvda-testkit
          key: nvda-launcher-stable-${{ github.run_id }}
          restore-keys: nvda-launcher-stable-

      - run: nvda-testkit doctor
      - run: pytest tests_e2e/ -v

      - name: Save NVDA launcher cache
        if: always() && github.event_name != 'pull_request'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/nvda-testkit
          key: nvda-launcher-stable-${{ github.run_id }}

      - if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: e2e-artifacts
          path: testOutput/
          if-no-files-found: warn

  upload_release:
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: ["build", "test"]
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        persist-credentials: false

    - name: Validate release tag format
      run: |
        TAG=${GITHUB_REF#refs/tags/}
        if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
          echo "::error::Tag '$TAG' does not match the required vMAJOR.MINOR.PATCH(-beta.N) format"
          exit 1
        fi

    - name: download releases files
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: packaged_addon

    - name: Display structure of downloaded files
      run: ls -R

    # Scoped to the previous vX.Y.Z(-beta.N) tag so notes don't pull in whatever unrelated
    # tag happened to be pushed most recently. --exclude-drafts keeps an unpublished draft
    # (semver-shaped or not) from being picked as that baseline.
    - name: Resolve previous release tag
      id: prev
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        TAG=${GITHUB_REF#refs/tags/}
        previous_tag="$(gh release list --exclude-drafts --json tagName -q '.[].tagName' \
          | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$' | grep -vFx "$TAG" | sort -rV | head -n1 || true)"
        echo "tag=${previous_tag}" >> "$GITHUB_OUTPUT"

    # Notes come from the generate-notes API directly, not gh release create's
    # --generate-notes, so a rerun recomputes the same fresh text instead of re-appending
    # SHA256 onto whatever an earlier run already wrote to the live release body.
    - name: Generate release notes
      env:
        GH_TOKEN: ${{ github.token }}
        PREVIOUS_TAG: ${{ steps.prev.outputs.tag }}
      run: |
        set -euo pipefail
        TAG=${GITHUB_REF#refs/tags/}
        args=(-f tag_name="$TAG")
        if [ -n "$PREVIOUS_TAG" ]; then
          args+=(-f previous_tag_name="$PREVIOUS_TAG")
        fi
        gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" "${args[@]}" -q .body > changelog.md
        echo -e "\nSHA256: " >> changelog.md
        sha256sum -- *.nvda-addon >> changelog.md

    # tag-and-release.yml unconditionally re-dispatches this workflow on a retry, including
    # after a run that already published the release -- `gh release create` on an existing
    # tag fails outright, so branch to edit+upload instead of erroring out on a rerun.
    - name: Create or update release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        TAG=${GITHUB_REF#refs/tags/}
        prerelease_args=()
        if [[ "$TAG" == *-* ]]; then
          prerelease_args=(--prerelease)
        fi
        if gh release view "$TAG" >/dev/null 2>&1; then
          gh release edit "$TAG" --notes-file changelog.md "${prerelease_args[@]}"
          gh release upload "$TAG" --clobber -- *.nvda-addon *.pot
        else
          gh release create "$TAG" \
            --title "$TAG" \
            --verify-tag \
            --notes-file changelog.md \
            "${prerelease_args[@]}" \
            -- *.nvda-addon *.pot
        fi

    - name: Store submission summary
      run: |
        ADDON_FILE=$(ls -- *.nvda-addon)
        SHA256=$(sha256sum "$ADDON_FILE" | awk '{print $1}')
        TAG=${GITHUB_REF#refs/tags/}
        REPO="${GITHUB_REPOSITORY}"
        DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${TAG}/${ADDON_FILE}"
        {
          echo "## NVDA Add-on Store submission values"
          echo ""
          echo "| Field | Value |"
          echo "|---|---|"
          echo "| **Download URL** | \`${DOWNLOAD_URL}\` |"
          echo "| **SHA256** | \`${SHA256}\` |"
          echo ""
          echo "Use these values when filling in the [Add-on Store registration form](https://github.com/nvaccess/addon-datastore/issues/new?template=registerAddon.yml)."
        } >> "$GITHUB_STEP_SUMMARY"

