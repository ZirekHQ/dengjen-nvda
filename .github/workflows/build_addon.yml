name: build addon

on:
  push:
    tags: ["*"]
    # To build on main/master branch, uncomment the following line:
    # branches: [ main , master ]

  pull_request:
    branches: [ main, master ]

  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade --only-binary :all: -r requirements-bootstrap.txt
        pip install --only-binary :all: -r requirements-build.txt
        sudo apt-get update  -y
        sudo apt-get install -y gettext

    - name: Code checks
      run: export SKIP=no-commit-to-branch; pre-commit run --all

    - name: building addon
      run: scons && scons pot

    - uses: actions/upload-artifact@v5
      with:
        name: packaged_addon
        path: |
          ./*.nvda-addon
          ./*.pot

  test_matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade --only-binary :all: -r requirements-bootstrap.txt
          pip install --only-binary :all: -r requirements-test.txt

      - name: Run tests
        run: pytest

  # Stable check name for branch protection: matrix jobs report as
  # "test_matrix (<os>)", so the bare name would never be published.
  test:
    runs-on: ubuntu-latest
    needs: ["test_matrix"]
    if: always()
    steps:
      - name: Check matrix result
        run: |
          if [ "${{ needs.test_matrix.result }}" != "success" ]; then
            echo "test_matrix concluded: ${{ needs.test_matrix.result }}"
            exit 1
          fi

  upload_release:
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: ["build", "test"]
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v5
    
    - name: download releases files
      uses: actions/download-artifact@v4
      with:
        name: packaged_addon

    - name: Display structure of downloaded files
      run: ls -R
      
    - name: Calculate sha256
      run: |
        touch changelog.md
        echo -e "\nSHA256: " >> changelog.md
        sha256sum -- *.nvda-addon >> changelog.md

    - name: Release
      id: release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
      with:
        files: |
          *.nvda-addon
          *.pot
        body_path: changelog.md
        fail_on_unmatched_files: true
        prerelease: ${{ contains(github.ref, '-') }}

    - name: Store submission summary
      run: |
        ADDON_FILE=$(ls -- *.nvda-addon)
        SHA256=$(sha256sum "$ADDON_FILE" | awk '{print $1}')
        TAG=${GITHUB_REF#refs/tags/}
        REPO="${GITHUB_REPOSITORY}"
        DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${TAG}/${ADDON_FILE}"
        echo "## NVDA Add-on Store submission values" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
        echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
        echo "| **Download URL** | \`${DOWNLOAD_URL}\` |" >> "$GITHUB_STEP_SUMMARY"
        echo "| **SHA256** | \`${SHA256}\` |" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "Use these values when filling in the [Add-on Store registration form](https://github.com/nvaccess/addon-datastore/issues/new?template=registerAddon.yml)." >> "$GITHUB_STEP_SUMMARY"

