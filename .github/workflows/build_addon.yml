name: build addon

on:
  push:
    tags: ["v*"]
    # To build on main/master branch, uncomment the following line:
    # branches: [ main , master ]

  pull_request:
    branches: [ main, master ]

  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: "3.13"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade --only-binary :all: -r requirements-bootstrap.txt
        pip install --only-binary :all: -r requirements-build.txt
        sudo apt-get update  -y
        sudo apt-get install -y gettext

    - name: Code checks
      run: export SKIP=no-commit-to-branch; pre-commit run --all

    - name: building addon
      run: scons && scons pot

    - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
      with:
        name: packaged_addon
        path: |
          ./*.nvda-addon
          ./*.pot

  test_matrix:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade --only-binary :all: -r requirements-bootstrap.txt
          pip install --only-binary :all: -r requirements-test.txt

      - name: Run tests
        run: pytest

      # Separate invocation, not folded into `pytest` above: testpaths=tests
      # already keeps this out of that run, and tests_contract/'s conftest.py
      # imports the real grpc package (incompatible with tests/conftest.py's
      # MagicMock stub of it). dengjen-tts-grpc.exe is a Windows binary, so this
      # only does anything on the windows-latest leg of the matrix; the test
      # module self-skips on other platforms.
      - name: Run gRPC contract tests
        if: runner.os == 'Windows'
        run: pytest tests_contract/ -v

      # Separate invocation for the same reason as the contract tests above:
      # tests_gui/ imports the real wxPython that tests/conftest.py replaces
      # with a module stub, and a stub cannot be a base class for the
      # wx.ListCtrl / SizedDialog subclasses in components.py. wxPython ships
      # no Linux wheels on PyPI, so this is the Windows leg only; the test
      # modules self-skip elsewhere.
      - name: Run GUI smoke tests
        if: runner.os == 'Windows'
        run: |
          pip install --only-binary :all: -r requirements-test-gui.txt
          pytest tests_gui/ -v

  # Stable check name for branch protection: matrix jobs report as
  # "test_matrix (<os>)", so the bare name would never be published.
  test:
    runs-on: ubuntu-latest
    permissions: {}
    needs: ["test_matrix"]
    if: always()
    steps:
      - name: Check matrix result
        run: |
          if [ "${{ needs.test_matrix.result }}" != "success" ]; then
            echo "test_matrix concluded: ${{ needs.test_matrix.result }}"
            exit 1
          fi

  e2e:
    runs-on: windows-2025
    permissions:
      contents: read
    needs: ["build"]
    # Real network calls to Hugging Face for voice downloads (added in a
    # later task) make this slower and flakier than the deterministic
    # suites, so it's kept out of the `test` gate deliberately rather than
    # blocking merges on a flaky external dependency.
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: download built addon
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packaged_addon

      - name: Install e2e test dependencies
        run: "pip install --only-binary :all: -r requirements-test-e2e.txt"

      - name: Restore NVDA launcher cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/nvda-testkit
          key: nvda-launcher-stable-${{ github.run_id }}
          restore-keys: nvda-launcher-stable-

      - run: nvda-testkit doctor
      - run: pytest tests_e2e/ -v

      - name: Save NVDA launcher cache
        if: always() && github.event_name != 'pull_request'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/nvda-testkit
          key: nvda-launcher-stable-${{ github.run_id }}

      - if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: e2e-artifacts
          path: testOutput/
          if-no-files-found: warn

  upload_release:
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: ["build", "test"]
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        persist-credentials: false

    - name: Validate release tag format
      run: |
        TAG=${GITHUB_REF#refs/tags/}
        if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
          echo "::error::Tag '$TAG' does not match the required vMAJOR.MINOR.PATCH(-beta.N) format"
          exit 1
        fi

    - name: download releases files
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: packaged_addon

    - name: Display structure of downloaded files
      run: ls -R

    # Scoped to the previous vX.Y.Z(-beta.N) tag so --generate-notes doesn't pull in
    # whatever unrelated tag happened to be pushed most recently.
    - name: Resolve previous release tag
      id: prev
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        TAG=${GITHUB_REF#refs/tags/}
        previous_tag="$(gh release list --json tagName -q '.[].tagName' \
          | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$' | grep -vFx "$TAG" | sort -rV | head -n1 || true)"
        echo "tag=${previous_tag}" >> "$GITHUB_OUTPUT"

    - name: Create release
      env:
        GH_TOKEN: ${{ github.token }}
        PREVIOUS_TAG: ${{ steps.prev.outputs.tag }}
      run: |
        set -euo pipefail
        TAG=${GITHUB_REF#refs/tags/}
        notes_args=(--generate-notes)
        if [ -n "$PREVIOUS_TAG" ]; then
          notes_args=(--generate-notes --notes-start-tag "$PREVIOUS_TAG")
        fi
        prerelease_args=()
        if [[ "$TAG" == *-* ]]; then
          prerelease_args=(--prerelease)
        fi
        gh release create "$TAG" \
          --title "$TAG" \
          --verify-tag \
          "${notes_args[@]}" \
          "${prerelease_args[@]}" \
          -- *.nvda-addon *.pot

    # gh release create's --generate-notes has no way to append extra content in the same
    # call, hence the follow-up edit to fold the SHA256 (needed for the Add-on Store
    # submission below) into the notes GitHub already generated.
    - name: Append SHA256 to release notes
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        TAG=${GITHUB_REF#refs/tags/}
        gh release view "$TAG" --json body -q .body > changelog.md
        echo -e "\nSHA256: " >> changelog.md
        sha256sum -- *.nvda-addon >> changelog.md
        gh release edit "$TAG" --notes-file changelog.md

    - name: Store submission summary
      run: |
        ADDON_FILE=$(ls -- *.nvda-addon)
        SHA256=$(sha256sum "$ADDON_FILE" | awk '{print $1}')
        TAG=${GITHUB_REF#refs/tags/}
        REPO="${GITHUB_REPOSITORY}"
        DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${TAG}/${ADDON_FILE}"
        {
          echo "## NVDA Add-on Store submission values"
          echo ""
          echo "| Field | Value |"
          echo "|---|---|"
          echo "| **Download URL** | \`${DOWNLOAD_URL}\` |"
          echo "| **SHA256** | \`${SHA256}\` |"
          echo ""
          echo "Use these values when filling in the [Add-on Store registration form](https://github.com/nvaccess/addon-datastore/issues/new?template=registerAddon.yml)."
        } >> "$GITHUB_STEP_SUMMARY"

