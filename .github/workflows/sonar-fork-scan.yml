name: Sonar fork scan

# No safe way to auto-scan fork PRs: a job holding SONAR_TOKEN must never
# execute fork-derived code. So this triggers only on a maintainer's
# `/sonar` comment and only `tar`-extracts sonar-fork-coverage.yml's artifact.

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  # Every PR comment fires this trigger, not just /sonar ones. Non-/sonar
  # comments get their own per-comment-id group so an unrelated comment (even
  # our own bot's result comment) can't cancel a scan mid-flight.
  group: sonar-fork-scan-${{ github.event.issue.number }}-${{ startsWith(github.event.comment.body, '/sonar') && 'sonar' || github.event.comment.id }}
  cancel-in-progress: true

jobs:
  acknowledge:
    # This condition is the only thing standing between a fork PR and
    # SONAR_TOKEN -- the scan job depends on it via `needs` rather than
    # repeating the check, so the two can't drift out of sync.
    if: >-
      github.event.issue.pull_request != null
      && startsWith(github.event.comment.body, '/sonar')
      && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    name: Acknowledge
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Log the trusted trigger
        env:
          COMMENT_USER: ${{ github.event.comment.user.login }}
          COMMENT_ASSOCIATION: ${{ github.event.comment.author_association }}
        run: echo "::notice::/sonar triggered by $COMMENT_USER ($COMMENT_ASSOCIATION)"

  scan:
    name: Sonar fork scan
    needs: acknowledge
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read # needed by `gh pr view` to resolve the PR's current head
      actions: read # needed to find and download the matching coverage run's artifact
      statuses: write # needed to post the real result to the PR's head commit ourselves (see below)
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Resolve the PR's current head
        id: pr
        run: |
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json headRefOid,headRefName \
            --jq '"head_sha=\(.headRefOid)\nhead_ref=\(.headRefName)"' \
            >> "$GITHUB_OUTPUT"

      - name: Find the matching coverage run
        id: run
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          RUN_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/sonar-fork-coverage.yml/runs?event=pull_request&status=success&per_page=20" \
            --jq "[.workflow_runs[] | select(.head_sha == \"$HEAD_SHA\")][0].id")
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::No successful 'Sonar fork coverage' run found for $HEAD_SHA. Push a commit or re-run that workflow first."
            exit 1
          fi
          echo "id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download coverage workspace
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sonar-fork-workspace
          path: ${{ runner.temp }}/sonar-fork-workspace
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract workspace (plain tar, not a git operation)
        env:
          ARCHIVE_DIR: ${{ runner.temp }}/sonar-fork-workspace
        run: |
          mkdir -p workspace
          tar -xzf "$ARCHIVE_DIR/workspace.tar.gz" -C workspace

      # SonarCloud's own GitHub status-posting attaches to whatever commit the
      # triggering event points to -- main's tip here, since this runs off
      # issue_comment, not the PR head -- so this posts to the real head SHA itself.
      - name: SonarQube scan
        id: sonar
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        with:
          args: >
            -Dsonar.projectBaseDir=workspace
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.pullrequest.key=${{ env.PR_NUMBER }}
            -Dsonar.pullrequest.branch=${{ steps.pr.outputs.head_ref }}
            -Dsonar.pullrequest.base=main
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

      - name: Post the real result to the PR's head commit
        if: always() && env.SONAR_TOKEN != ''
        env:
          SCAN_OUTCOME: ${{ steps.sonar.outcome }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$SCAN_OUTCOME" = "success" ]; then
            STATE=success
            DESC="Quality gate passed"
          else
            STATE=failure
            DESC="Quality gate failed or scan errored -- see the SonarCloud dashboard"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state="$STATE" \
            -f context='SonarCloud Code Analysis' \
            -f description="$DESC" \
            -f target_url="https://sonarcloud.io/dashboard?id=ZirekHQ_dengjen-nvda&pullRequest=$PR_NUMBER"
