name: Fetch vendored libs
description: Installs the win_amd64 libraries pinned in uv.lock into the add-on's lib/, cached per lock hash. Needs Python on PATH.

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: 0.12.22
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: addon/synthDrivers/dengjen_neural_voices/lib
        key: vendored-libs-${{ runner.os }}-${{ hashFiles('uv.lock', 'vendor_libs.py', 'pyproject.toml') }}
    - shell: bash
      run: python vendor_libs.py fetch
