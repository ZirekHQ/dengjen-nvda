rules:
  superfluous-actions:
    ignore:
      # `gh release create` cannot replace this step: it has no equivalent of
      # fail_on_unmatched_files, which is what keeps a release from publishing
      # without the .nvda-addon attached.
      - build_addon.yaml
  dangerous-triggers:
    ignore:
      # The SONAR_TOKEN job only tar-extracts the secretless coverage artifact; see the
      # header of sonar-fork-scan.yaml.
      - sonar-fork-scan.yaml
  self-repository:
    ignore:
      # actionlint rejects the `$/` form (rhysd/actionlint#711); drop these
      # once it supports it.
      - build_addon.yaml
      - sonar.yaml
      - sonar-fork-coverage.yaml
      - nvda-compat-guard.yaml
      - perf.yaml
